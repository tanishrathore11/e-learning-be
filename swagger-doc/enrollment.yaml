paths:
  /enrollments/me:
    get:
      tags:
        - Enrollments
      summary: Get my enrollments
      description: Returns the enrollments for the currently authenticated student (userId from JWT).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of enrollments
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — STUDENT only
