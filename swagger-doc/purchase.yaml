paths:
  /purchases:
    post:
      tags:
        - Purchases
      summary: Create a purchase
      description: Purchase one or more courses. The userId is taken from the JWT, and prices are determined by the backend database.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - courseId
                    properties:
                      courseId:
                        type: string
                        format: uuid
                        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "201":
          description: Purchase created
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — STUDENT only
        "404":
          description: Course not found
        "409":
          description: User is already enrolled in one or more of the requested courses

  /purchases/me:
    get:
      tags:
        - Purchases
      summary: Get my purchases
      description: Returns all purchases for the authenticated student (userId from JWT).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of purchases
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — STUDENT only

