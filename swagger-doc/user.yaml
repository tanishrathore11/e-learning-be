paths:
  /users/me:
    get:
      tags:
        - Users
      summary: Get the current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      bio:
                        type: string
                        nullable: true
        "401":
          description: Unauthorized / invalid JWT

    patch:
      tags:
        - Users
      summary: Update the current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Updated
                bio:
                  type: string
                  nullable: true
                  example: Updated bio text
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      bio:
                        type: string
                        nullable: true
        "400":
          description: Validation error
        "401":
          description: Unauthorized / invalid JWT
