paths:
  /topics:
    post:
      tags:
        - Topics
      summary: Create a new topic
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Web Development
                description:
                  type: string
                  nullable: true
                  example: Frontend and backend web technologies
      responses:
        "201":
          description: Topic created
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Forbidden — ADMIN only
        "409":
          description: Topic name already exists

    get:
      tags:
        - Topics
      summary: Get all topics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of topics
        "401":
          description: Not authenticated


  /topics/{id}/courses:
    get:
      tags:
        - Topics
      summary: Get courses by topic
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of courses for the topic
        "401":
          description: Not authenticated
        "404":
          description: Topic not found
